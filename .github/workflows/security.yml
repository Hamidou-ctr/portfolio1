name: Security Audit

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0" # einmal pro Woche

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Nur Produktions-Abhängigkeiten: nur sie landen beim Nutzer
      - run: npm audit --omit=dev --audit-level=high
