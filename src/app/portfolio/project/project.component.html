<div class="overlay">
  @for (project of projects; track project.name; let i = $index) {
    <section
      [class.left]="i % 2 === 0"
      [class.right]="i % 2 !== 0"
      >
      <img
        [src]="project.imageUrl"
        [alt]="project.name | translate"
        data-aos="flip-left"
        data-aos-easing="ease-out-cubic"
        data-aos-duration="1000"
        />
      <div
        class="project-content"
        data-aos="fade-up"
        data-aos-anchor-placement="center-up"
        >
        <h1>{{ project.name | translate }}</h1>
        <h4>{{ project.language }}</h4>
        <p>{{ project.description | translate }}</p>
        <span
          data-aos="flip-left"
          data-aos-easing="ease-out-cubic"
          data-aos-duration="1000"
          >
          <a
            target="_blank"
            [href]="project.liveTestUrl"
            class="project-link test"
            >
            {{ "ProjectsComponent.live_test_button" | translate }}
          </a>
          <a
            target="_blank"
            [href]="project.githubUrl"
            class="project-link GitHub"
            >GitHub</a
            >
          </span>
        </div>
      </section>
    }
  </div>
