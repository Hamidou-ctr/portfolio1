<div #refereceSection class="container">
  @for (section of sections; track $index; let i = $index) {
    <section [class.active]="currentIndex() === i">
      <main>
        <img src="assets/img/purple_reference.png" alt="">
        <span>{{ section.text }}</span>
        <div>
          <h1>{{ section.title }}</h1>
          <p>{{ section.author }}</p>
        </div>
      </main>
      <div>
        <img [src]="section.profileImage" alt="" />
        <h2>{{ section.name }}</h2>
      </div>
    </section>
  }
</div>

<menu>
  <img src="assets/img/left.png" alt="" (click)="previousSection()" [class.disabled]="currentIndex() === 0" />
  @for (section of sections; track $index; let i = $index) {
    <p [class.active]="currentIndex() === i"></p>
  }
  <img
    src="assets/img/right.png"
    alt=""
    (click)="nextSection()"
    [class.disabled]="currentIndex() === sections.length - 1"
    />
</menu>
